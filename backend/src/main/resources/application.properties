spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5434/cross
spring.datasource.username=cross
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
cross.reminders.scheduler-enabled=true
cross.jwt.secret=${JWT_SECRET:}
cross.jwt.lifetime=${JWT_LIFETIME:15m}
cross.cors.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
logging.level.org.hibernate.orm.jdbc.error=OFF
